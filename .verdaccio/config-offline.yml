# Deliberately no uplinks: Execution release verification seeds the exact
# already-published core tarballs before publishing the Execution group.
storage: ../tmp/local-registry-offline/storage

packages:
  '**':
    access: $all
    publish: $all
    unpublish: $all

log:
  type: stdout
  format: pretty
  level: warn

publish:
  allow_offline: true
