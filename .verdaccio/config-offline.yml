# The platform scope is deliberately local-only: published core tarballs are
# seeded explicitly and the Execution group is published by Nx Release.
# Third-party runtime dependencies may still resolve from npm.
storage: ../tmp/local-registry-offline/storage

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@event-driven-platform/*':
    access: $all
    publish: $all
    unpublish: $all

  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

log:
  type: stdout
  format: pretty
  level: warn

publish:
  allow_offline: true
