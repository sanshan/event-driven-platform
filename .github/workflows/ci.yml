name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Affected validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Detect Redis coordinator impact
        id: redis-coordinator
        shell: bash
        run: |
          if pnpm nx show projects --affected | grep -Fxq '@event-driven-platform/read-execution-coordinator-redis'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate affected projects
        run: pnpm nx affected -t lint test typecheck build

      - name: Start Redis integration service
        if: steps.redis-coordinator.outputs.affected == 'true'
        shell: bash
        run: |
          docker run --detach --rm \
            --name read-coordinator-redis \
            --publish 6379:6379 \
            redis:7.4-alpine

          for attempt in {1..30}; do
            if docker exec read-coordinator-redis redis-cli ping | grep -Fxq PONG; then
              exit 0
            fi
            sleep 1
          done

          docker logs read-coordinator-redis
          exit 1

      - name: Verify Redis coordinator integration
        if: steps.redis-coordinator.outputs.affected == 'true'
        env:
          READ_COORDINATOR_REDIS_URL: redis://127.0.0.1:6379
        run: pnpm nx run @event-driven-platform/read-execution-coordinator-redis:test:integration

      - name: Stop Redis integration service
        if: always() && steps.redis-coordinator.outputs.affected == 'true'
        run: docker rm --force read-coordinator-redis || true

      - name: Verify packages through Verdaccio
        run: pnpm nx run package-verification:verify-registry
