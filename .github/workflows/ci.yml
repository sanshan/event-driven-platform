name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Affected validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@v5

      - name: Validate affected projects
        run: pnpm nx affected -t lint test typecheck build

      - name: Detect affected public packages
        id: public-packages
        shell: bash
        run: |
          AFFECTED="$(pnpm nx show projects --affected --json)" \
          CHANGED_FILES="$(git diff --name-only "$NX_BASE" "$NX_HEAD")" \
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const affected = new Set(JSON.parse(process.env.AFFECTED));
          const changedFiles = (process.env.CHANGED_FILES ?? '').split('\n').filter(Boolean);
          const packagesRoot = path.join(process.cwd(), 'packages');
          const publicProjects = fs
              .readdirSync(packagesRoot, { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => {
                  const manifest = JSON.parse(
                      fs.readFileSync(path.join(packagesRoot, entry.name, 'package.json'), 'utf8'),
                  );
                  return manifest.private === true ? null : manifest.name;
              })
              .filter(Boolean);
          const verificationToolingChanged = changedFiles.some(
              (file) =>
                  file === 'nx.json' ||
                  file === 'package.json' ||
                  file === 'tools/start-local-registry.ts' ||
                  file === 'tools/package-verification/project.json' ||
                  file === 'tools/package-verification/registry.vitest.config.ts' ||
                  file === 'tools/package-verification/verify-local-registry.spec.ts' ||
                  file === 'tools/package-verification/verify-packed-packages.mjs' ||
                  file.startsWith('tools/package-verification/fixture-execution/'),
          );
          const required =
              verificationToolingChanged || publicProjects.some((project) => affected.has(project));

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `required=${required}\n`);
          NODE

      - name: Verify packed public packages
        if: steps.public-packages.outputs.required == 'true'
        run: pnpm nx run package-verification:verify

      - name: Verify public packages through Verdaccio
        if: steps.public-packages.outputs.required == 'true'
        run: pnpm nx run package-verification:verify-registry
