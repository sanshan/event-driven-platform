name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org/

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.19.0

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm nx run-many -t build --projects='packages/*'

      - name: Publish packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t projects < <(pnpm nx show projects --with-target=nx-release-publish)

          for project in "${projects[@]}"; do
            echo "Publishing ${project}"

            published=false
            for attempt in 1 2 3 4; do
              if pnpm nx release publish --projects="${project}" --parallel=1; then
                published=true
                break
              fi

              if [ "${attempt}" -lt 4 ]; then
                delay=$((60 * 2 ** (attempt - 1)))
                echo "Publish attempt ${attempt} failed for ${project}; retrying in ${delay}s"
                sleep "${delay}"
              fi
            done

            if [ "${published}" != true ]; then
              echo "Failed to publish ${project} after 4 attempts"
              exit 1
            fi

            sleep 20
          done
