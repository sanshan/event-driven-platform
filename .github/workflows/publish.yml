name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish public core
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org/

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.19.0

      - run: pnpm install --frozen-lockfile

      - name: Verify tag belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release state
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node tools/release/verify-release-state.mjs "$VERSION"

      - name: Build public core
        shell: bash
        run: |
          PROJECTS="$(node -e "const fs=require('node:fs');const nx=JSON.parse(fs.readFileSync('nx.json','utf8'));process.stdout.write(nx.release.groups.core.projects.join(','))")"
          pnpm nx run-many -t build --projects="$PROJECTS"

      - name: Publish public core
        run: pnpm nx release publish --groups=core --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
