name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
      - 'execution-v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish release group
    runs-on: ubuntu-latest
    environment: npm-production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org/

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.19.0

      - run: pnpm install --frozen-lockfile

      - name: Verify tag belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve release group
        id: release
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            execution-v*.*.*)
              echo "group=execution" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#execution-v}" >> "$GITHUB_OUTPUT"
              ;;
            v*.*.*)
              echo "group=core" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

      - name: Verify release state
        shell: bash
        run: |
          node tools/release/verify-release-state.mjs \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.group }}"

      - name: Build release group
        shell: bash
        run: |
          GROUP="${{ steps.release.outputs.group }}"
          PROJECTS="$(GROUP="$GROUP" node -e "const fs=require('node:fs');const nx=JSON.parse(fs.readFileSync('nx.json','utf8'));process.stdout.write(nx.release.groups[process.env.GROUP].projects.join(','))")"
          pnpm nx run-many -t build --projects="$PROJECTS"

      - name: Publish release group
        shell: bash
        run: |
          pnpm nx release publish \
            --groups="${{ steps.release.outputs.group }}" \
            --access=public
