name: Finalize Release

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: finalize-release
  cancel-in-progress: false

jobs:
  finalize:
    name: Create package tags
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'release/next'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate merged release state
        shell: bash
        run: |
          test -f .github/release-state.json

          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const state = JSON.parse(
            readFileSync('.github/release-state.json', 'utf8'),
          );

          if (state.schemaVersion !== 1) {
            throw new Error('Unsupported release-state schema version.');
          }
          if (!/^[0-9a-f]{40}$/.test(state.preparedFrom)) {
            throw new Error('Invalid preparedFrom commit.');
          }
          if (!Array.isArray(state.tags) || state.tags.length === 0) {
            throw new Error('Release state contains no package tags.');
          }
          if (new Set(state.tags).size !== state.tags.length) {
            throw new Error('Release state contains duplicate package tags.');
          }
          if (state.tags.some((tag) => typeof tag !== 'string' || tag.length === 0)) {
            throw new Error('Release state contains an invalid package tag.');
          }
          NODE

          prepared_from="$(node -p "require('./.github/release-state.json').preparedFrom")"
          release_parent="$(git rev-parse HEAD^1)"

          if [[ "$release_parent" != "$prepared_from" ]]; then
            echo "main changed after this release was prepared." >&2
            echo "Revert the stale release merge and prepare a new release." >&2
            exit 1
          fi

      - name: Create package tags
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          release_commit="$(git rev-parse HEAD)"
          mapfile -t release_tags < <(
            node -e "for (const tag of require('./.github/release-state.json').tags) console.log(tag)"
          )
          tag_refs=()

          for tag in "${release_tags[@]}"; do
            git check-ref-format "refs/tags/$tag"
            existing_commit="$(
              git rev-parse --quiet --verify "refs/tags/$tag^{commit}" 2>/dev/null || true
            )"

            if [[ -n "$existing_commit" && "$existing_commit" != "$release_commit" ]]; then
              echo "Tag $tag already points to $existing_commit." >&2
              exit 1
            fi

            if [[ -z "$existing_commit" ]]; then
              git tag --annotate "$tag" --message "$tag" "$release_commit"
            fi

            tag_refs+=("refs/tags/$tag")
          done

          git push --atomic origin "${tag_refs[@]}"

          {
            echo "Created package tags on $release_commit:"
            printf -- '- `%s`\n' "${release_tags[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
