name: Prepare release 0.1.0 (temporary)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/0.1.0'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/0.1.0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Disable release commit and tag inside this runner
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const nx = JSON.parse(fs.readFileSync('nx.json', 'utf8'));
          nx.release.git = {
              ...(nx.release.git ?? {}),
              commit: false,
              tag: false,
          };
          fs.writeFileSync('nx.json', `${JSON.stringify(nx, null, 4)}\n`);
          NODE

      - name: Generate release state with Nx Release
        run: pnpm nx release 0.1.0 --first-release --skip-publish

      - name: Restore repository release configuration
        run: git checkout -- nx.json

      - name: Verify generated release state
        run: node tools/release/verify-release-state.mjs 0.1.0

      - name: Commit Nx Release output
        shell: bash
        run: |
          git reset
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json packages/*/CHANGELOG.md pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Nx Release produced no changes" >&2
            exit 1
          fi
          git commit -m "chore(release): publish 0.1.0"
          git push origin HEAD:release/0.1.0
