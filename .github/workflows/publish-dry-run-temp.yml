name: Publish dry run (temporary)

on:
  pull_request:
    branches:
      - epic/9-first-public-core-release

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org/

      - run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node tools/release/verify-release-state.mjs 0.0.1
      - run: |
          PROJECTS="$(node -e "const fs=require('node:fs');const nx=JSON.parse(fs.readFileSync('nx.json','utf8'));process.stdout.write(nx.release.groups.core.projects.join(','))")"
          pnpm nx run-many -t build --projects="$PROJECTS"
      - run: pnpm nx release publish --groups=core --access=public --dry-run
